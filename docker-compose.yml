version: '3.8'

services:
  # Companio Express + Socket.io Server Service
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: companio-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ENABLE_SMS_ESCALATION=${ENABLE_SMS_ESCALATION}
      - ENABLE_EMAIL_ESCALATION=${ENABLE_EMAIL_ESCALATION}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - CLINICIAN_NOTIFICATION_EMAIL=${CLINICIAN_NOTIFICATION_EMAIL}
      - CLINICIAN_NOTIFICATION_PHONE=${CLINICIAN_NOTIFICATION_PHONE}
      - APP_BASE_URL=${APP_BASE_URL}

  # Companio Vite React Frontend Service (Nginx static server)
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: companio-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server
