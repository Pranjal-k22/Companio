version: '3.8'

services:
  # Primary Persistence: MongoDB Replica Set / Database
  mongodb:
    image: mongo:6.0
    container_name: companio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=companio
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # Distributed Broker: Redis with Append-Only Persistence (AOF)
  redis:
    image: redis:7-alpine
    container_name: companio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M

  # Companio Express + Socket.io Server Service
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: companio-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/companio
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-replace_with_secure_production_32char_key}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - ENABLE_SMS_ESCALATION=${ENABLE_SMS_ESCALATION:-false}
      - ENABLE_EMAIL_ESCALATION=${ENABLE_EMAIL_ESCALATION:-false}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5173}
      - AUDIO_RETENTION_MODE=disabled
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M

  # Dedicated Background Worker Fleet (BullMQ Queue Processors)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: companio-worker
    restart: unless-stopped
    command: ["node", "-e", "import('./server/src/jobs/workerBootstrap.js').then(m => m.initBackgroundWorkers());"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/companio
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-replace_with_secure_production_32char_key}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      - ENABLE_SMS_ESCALATION=${ENABLE_SMS_ESCALATION:-false}
      - ENABLE_EMAIL_ESCALATION=${ENABLE_EMAIL_ESCALATION:-false}
      - AUDIO_RETENTION_MODE=disabled
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

  # Companio Vite React Frontend Service (Nginx static SPA)
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: companio-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local
