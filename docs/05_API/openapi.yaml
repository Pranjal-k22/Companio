openapi: 3.1.0
info:
  title: Companio Healthcare Platform API
  description: >-
    Production API specification for Companio, an AI voice-first health and wellness
    monitoring platform designed for adults aged 55+. Supports dual-compatible versioned
    endpoints (/api/v1 and legacy /api aliases), RFC 9457 problem details, correlation
    tracking, and strict clinical parameter validation.
  version: 1.0.0
  contact:
    name: Companio Engineering Architecture Team
    email: engineering@companio.app
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server (v1 Namespace)
  - url: https://api.companio.app/api/v1
    description: Production Environment

paths:
  /health:
    get:
      summary: System Health & Readiness Check
      description: Returns service uptime, database connectivity state, and active API version namespace.
      responses:
        '200':
          description: System operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      summary: User Authentication
      description: Authenticates clinicians, patients, and administrators using email and password. Rate-limited to 50 attempts per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401AuthenticationError'

  /auth/me:
    get:
      summary: Current Authenticated User Identity
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/401AuthenticationError'

  /auth/profile:
    put:
      summary: Update User Profile & Accessibility Preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
        '400':
          $ref: '#/components/responses/400ValidationError'
        '401':
          $ref: '#/components/responses/401AuthenticationError'

  /auth/active-organization:
    post:
      summary: Switch Active Organization Context
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId]
              properties:
                organizationId:
                  type: string
      responses:
        '200':
          description: Context switched successfully
        '403':
          $ref: '#/components/responses/403ForbiddenError'

  /organizations:
    get:
      summary: List Organizations For Current User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User organization memberships
    post:
      summary: Create New Organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created (caller assigned ORG_OWNER)

  /organizations/{id}:
    get:
      summary: Get Organization Profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization details
    patch:
      summary: Update Organization Profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization updated

  /organizations/{id}/members:
    get:
      summary: List Organization Members
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member roster

  /organizations/{id}/invitations:
    post:
      summary: Dispatch Invitation to Organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Invitation created

  /organizations/{id}/teams:
    get:
      summary: List Organization Clinical Teams
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clinical care teams
    post:
      summary: Create Clinical Team
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Team created

  /patients:
    get:
      summary: List Assigned Patients
      description: Retrieves a paginated list of patients. Requires CLINICIAN or ADMIN role.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, createdAt, dateOfBirth, -createdAt, -name]
            default: -createdAt
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated patient roster
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListResponse'
        '401':
          $ref: '#/components/responses/401AuthenticationError'
        '403':
          $ref: '#/components/responses/403ForbiddenError'

  /patients/{id}:
    get:
      summary: Retrieve Patient Details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Detailed patient medical record and demographics
        '400':
          $ref: '#/components/responses/400ValidationError'
        '404':
          $ref: '#/components/responses/404NotFoundError'

  /patients/{patientId}/consents:
    get:
      summary: Get Patient Effective Consent and Audit Trail
      description: Returns active consent state across all 5 purposes and chronological audit trail.
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Effective consent status and audit trail
        '404':
          $ref: '#/components/responses/404NotFoundError'
    post:
      summary: Record Versioned Consent Decision
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  enum: [MICROPHONE, LIVE_TRANSCRIPTION, AI_PROCESSING, AUDIO_RETENTION, CLINICIAN_SHARING]
                decision:
                  type: string
                  enum: [GRANTED, WITHDRAWN]
                noticeVersion:
                  type: string
                notes:
                  type: string
      responses:
        '201':
          description: Consent decision recorded

  /patients/{patientId}/consents/withdraw:
    post:
      summary: Withdraw Specific or All Patient Consents
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                purposes:
                  type: array
                  items:
                    type: string
                notes:
                  type: string
      responses:
        '200':
          description: Consent withdrawal processed

  /patients/{patientId}/export:
    get:
      summary: Data Subject Access Request (DSAR) Patient Data Export
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Complete HIPAA/GDPR data export bundle

  /patients/{patientId}/anonymize:
    post:
      summary: Right to Erasure / Patient Anonymization Workflow
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                reason:
                  type: string
                confirmation:
                  type: boolean
      responses:
        '200':
          description: Patient demographics masked and all consents revoked

  /checkins/{patientId}:
    get:
      summary: List Patient Daily Voice Check-ins
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Historical check-in records

  /flags/triage:
    get:
      summary: Get Active Clinical Triage Queue
      description: Returns active flags for the organization, sorted with RED flags first.
      security:
        - bearerAuth: []
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [red, yellow]
        - name: status
          in: query
          schema:
            type: string
        - name: unacknowledgedOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Triage flags array
        '403':
          $ref: '#/components/responses/403ForbiddenError'

  /flags/{flagId}/acknowledge:
    post:
      summary: Acknowledge Clinical Alert
      description: Halts the SLA breach countdown clock. Sets acknowledgedAt and clinician ID.
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Flag acknowledged successfully

  /flags/{flagId}/assign:
    post:
      summary: Assign Responsible Clinician to Flag
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignedTo]
              properties:
                assignedTo:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
                reason:
                  type: string
      responses:
        '200':
          description: Clinician assigned to flag

  /flags/{flagId}/notes:
    post:
      summary: Add Clinician Review Note
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
      responses:
        '200':
          description: Review note added

  /flags/{flagId}/escalate:
    post:
      summary: Manually Escalate Flag
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Flag escalated

  /flags/{flagId}/resolve:
    post:
      summary: Resolve Clinical Flag with Mandatory Rationale
      description: Resolves the flag. Patients are strictly forbidden from calling this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolutionReason]
              properties:
                resolutionReason:
                  type: string
                isFalsePositive:
                  type: boolean
                duplicateOf:
                  type: string
      responses:
        '200':
          description: Flag resolved

  /flags/{flagId}/reopen:
    post:
      summary: Reopen Resolved Clinical Flag
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Flag reopened

  /flags/patient/{patientId}:
    get:
      summary: List Clinical Triage Flags for Patient
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Clinical safety flags sorted by severity and recency

  /flags/{id}/status:
    patch:
      summary: Update Clinical Triage Flag Status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, reviewed, escalated, resolved, dismissed]
                resolutionNotes:
                  type: string
      responses:
        '200':
          description: Flag status updated

  /reports:
    get:
      summary: List Clinical Reports
      description: Retrieves paginated clinical retrospective reports with filtering by patient, status, report type, date range, or staleness.
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: status
          in: query
          schema:
            type: string
            enum: [GENERATED, VALIDATING, DRAFT, PENDING_REVIEW, APPROVED, PUBLISHED, REJECTED, SUPERSEDED, AMENDED, STALE]
        - name: reportType
          in: query
          schema:
            type: string
            enum: [WEEKLY_RETROSPECTIVE, AD_HOC_SUMMARY, MONTHLY_REVIEW, INCIDENT_FOLLOWUP]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of clinical reports

  /reports/{id}:
    get:
      summary: Retrieve Clinical Report by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Synthesized clinical report with deterministic trend analytics and attestation

  /reports/{id}/versions:
    get:
      summary: Retrieve Report Version History
      description: Returns the complete immutable version lineage (v1, v2, etc.) for a root clinical report.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version lineage array

  /reports/{id}/attestations:
    get:
      summary: Retrieve Clinician Attestation History
      description: Returns the legal attestation records and SHA-256 verification hashes for the report.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attestation audit trail

  /reports/{id}/provenance:
    get:
      summary: Retrieve Report Provenance Graph
      description: Returns the SHA-256 canonical digest and claim-to-evidence graph linking narrative statements to source observation ObjectIds.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cryptographic provenance graph and source snapshots

  /reports/{id}/export:
    get:
      summary: Export Report as PDF or FHIR R4 Bundle
      description: Generates a binary PDF document (with watermarks for unapproved drafts) or structured FHIR R4 DiagnosticReport JSON bundle.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [pdf, fhir]
            default: pdf
      responses:
        '200':
          description: Exported document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object

  /reports/{id}/regenerate:
    post:
      summary: Regenerate Report Draft
      description: Re-runs the aggregator, deterministic analytics engine, and narration against the latest validated observations, incrementing version if draft.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Regenerated report document

  /reports/{id}/review:
    post:
      summary: Transition Report to Pending Review
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report transitioned to PENDING_REVIEW

  /reports/{id}/approve:
    post:
      summary: Clinician Attestation and Approval
      description: Clinician provides electronic attestation statement, SHA-256 hash validation, and locks report to APPROVED.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestationStatement, statementVersion, confirmedContentHash]
              properties:
                attestationStatement:
                  type: string
                statementVersion:
                  type: string
                confirmedContentHash:
                  type: string
                clinicalNotes:
                  type: string
      responses:
        '200':
          description: Approved report with attestation details

  /reports/{id}/reject:
    post:
      summary: Clinician Rejection of Report Draft
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectionReason]
              properties:
                rejectionReason:
                  type: string
      responses:
        '200':
          description: Report status transitioned to REJECTED

  /reports/{id}/amend:
    post:
      summary: Non-Destructive Clinician Amendment
      description: Creates a superseding report version (vN+1) preserving previous approved versions as AMENDED / SUPERSEDED.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amendmentReason, sections]
              properties:
                amendmentReason:
                  type: string
                sections:
                  type: object
      responses:
        '201':
          description: Newly created amended report version

  /reports/{id}/publish:
    post:
      summary: Publish Approved Clinical Report
      description: Marks an approved report as PUBLISHED for patient/caregiver visibility or EHR transmission.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report published

  /patients/{patientId}/reports/generate:
    post:
      summary: Trigger On-Demand Deterministic Report Generation
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reportType:
                  type: string
                  enum: [WEEKLY_RETROSPECTIVE, AD_HOC_SUMMARY, MONTHLY_REVIEW, INCIDENT_FOLLOWUP]
                  default: WEEKLY_RETROSPECTIVE
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Newly generated report in DRAFT status

  /appointments:
    get:
      summary: List Clinical Appointments
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Appointments list

  /lab-results/patient/{patientId}:
    get:
      summary: Retrieve Patient Diagnostic Lab Panels
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Laboratory diagnostics and biomarker panels

  /conversations:
    get:
      summary: Retrieve Conversation Transcripts & Voice Sessions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of conversational interactions and speech transcripts

  /patients/{patientId}/dialogue-sessions:
    post:
      summary: Initialize Clinical Dialogue Session
      description: Initiates a structured daily or weekly clinical check-in dialogue session.
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: string
                  enum: [DAILY_WELLNESS_CHECKIN, WEEKLY_HEALTH_REVIEW]
                conversationId:
                  type: string
      responses:
        '201':
          description: Dialogue session created and agenda initialized

  /dialogue-sessions/{id}:
    get:
      summary: Retrieve Dialogue Session
      description: Retrieves dialogue session state, current agenda stage, and confirmation status.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dialogue session details

  /dialogue-sessions/{id}/progress:
    get:
      summary: Retrieve Dialogue Session Progress
      description: Retrieves section progression, turn count, and pending clarifications.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session progress metrics

  /dialogue-sessions/{id}/observations:
    get:
      summary: Retrieve Observations for Dialogue Session
      description: Retrieves all clinical observations collected during the dialogue session.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of session observations

  /dialogue-sessions/{id}/clarifications:
    post:
      summary: Resolve Contradiction Clarification
      description: Resolves a contradiction or ambiguous observation with patient input.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clarification resolved

  /dialogue-sessions/{id}/confirm:
    post:
      summary: Confirm or Dispute Dialogue Session Observations
      description: Records explicit patient read-back confirmation status and projects to Checkin.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session confirmed and projected

  /dialogue-sessions/{id}/finalize:
    post:
      summary: Finalize Dialogue Session Idempotently
      description: Idempotently finalizes session and synthesizes verified Checkin document.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session finalized

  /patients/{patientId}/observations:
    get:
      summary: Retrieve Patient Observations
      description: Retrieves time-series clinical observations with provenance and LOINC mappings.
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paginated observations list

  /observations:
    get:
      summary: List Observations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Observations list
    post:
      summary: Create Clinical Observation
      description: Persists a validated clinical observation with provenance.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Observation created

  /observations/{id}:
    get:
      summary: Get Observation Details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Observation details

  /observations/{id}/amend:
    post:
      summary: Amend Clinical Observation
      description: Amends an observation with non-destructive versioning and audit trail.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Observation amended and superseded

  /observations/{id}/verify:
    post:
      summary: Verify Observation (Clinician Only)
      description: Records clinical verification or rejection by assigned care team.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Observation verified

  /patients/{id}/caregivers/invitations:
    post:
      summary: Create Caregiver Invitation
      description: Generates a single-use SHA-256 hashed cryptographic invitation for family or caregiver.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [caregiverEmail, relationshipType, scopes]
              properties:
                caregiverEmail:
                  type: string
                  format: email
                relationshipType:
                  type: string
                  enum: [SPOUSE, ADULT_CHILD, FAMILY_MEMBER, PROFESSIONAL_CAREGIVER, LEGAL_GUARDIAN, TRUSTED_FRIEND, OTHER]
                scopes:
                  type: array
                  items:
                    type: string
                legalAuthorityType:
                  type: string
                  enum: [POWER_OF_ATTORNEY, HEALTHCARE_PROXY, CONSERVATOR, LEGAL_GUARDIAN, INFORMAL_FAMILY, NONE]
                notes:
                  type: string
      responses:
        '201':
          description: Invitation created successfully

  /patients/{id}/caregivers:
    get:
      summary: List Patient Caregivers
      description: Lists all caregiver relationships and active scopes for the patient.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Caregivers and relationships retrieved

  /caregivers/invitations/{id}/revoke:
    post:
      summary: Revoke Caregiver Access
      description: Patient or clinician instantly revokes caregiver relationship and access grants.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Caregiver access revoked immediately

  /caregivers/invitations:
    get:
      summary: List Pending Invitations
      description: Lists pending caregiver invitations matching the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending invitations list

  /caregivers/invitations/{id}/accept:
    post:
      summary: Accept Caregiver Invitation
      description: Caregiver validates cryptographic token and links patient relationship.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Invitation accepted and account linked

  /caregiver/patients:
    get:
      summary: List Authorized Patients
      description: Returns all patients linked to the authenticated caregiver with active scopes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of linked patients

  /caregiver/patients/{id}/overview:
    get:
      summary: Caregiver Patient Overview
      description: Retrieves permitted high-level wellness score and safe status indicators.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Patient overview returned

  /caregiver/patients/{id}/concerns:
    post:
      summary: Submit Caregiver Concern
      description: Submits an attributed caregiver observation, evaluated against the Phase 5 safety net.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, description]
              properties:
                category:
                  type: string
                description:
                  type: string
                observedAt:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Concern recorded and evaluated

  /caregiver/patients/{id}/voice-assistance:
    post:
      summary: Start Voice Assistance Session
      description: Associates caregiver metadata with an assisted voice check-in session.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Voice assistance session initialized

  /patients/{id}/caregiver-access-events:
    get:
      summary: Get Patient Caregiver Access Events
      description: Retrieves tamper-evident accounting of disclosures for caregiver data views.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audit trail retrieved

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    400ValidationError:
      description: RFC 9457 Validation Failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    401AuthenticationError:
      description: RFC 9457 Authentication Required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    403ForbiddenError:
      description: RFC 9457 Role-Based Access Denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    404NotFoundError:
      description: RFC 9457 Resource Not Found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    ProblemDetails:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type:
          type: string
          format: uri
          example: 'https://companio.app/problems/validation-error'
        title:
          type: string
          example: 'Validation Error'
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: 'One or more fields failed validation.'
        instance:
          type: string
          example: '/api/v1/patients'
        code:
          type: string
          example: 'VALIDATION_ERROR'
        requestId:
          type: string
          format: uuid
          example: 'd13da109-3488-4d75-9709-c343fbb87d3b'
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
        success:
          type: boolean
          example: false
        message:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: 'ok'
        uptime:
          type: number
        database:
          type: string
          example: 'connected'
        apiNamespace:
          type: string
          example: '/api/v1'
        requestId:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            token:
              type: string
            user:
              type: object
        meta:
          type: object
          properties:
            requestId:
              type: string
            timestamp:
              type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [PATIENT, CLINICIAN, ADMIN, CAREGIVER]

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        voiceSpeed:
          type: number
          minimum: 0.5
          maximum: 2.0
        highContrastMode:
          type: boolean
        emergencyContact:
          type: object
          properties:
            name:
              type: string
            phone:
              type: string
            relationship:
              type: string

    PatientListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
        meta:
          type: object
          properties:
            requestId:
              type: string
            timestamp:
              type: string

    DeterministicMetrics:
      type: object
      properties:
        medicationAdherence:
          type: object
          properties:
            adherencePercentage:
              type: number
            dosesTaken:
              type: integer
            dosesMissed:
              type: integer
            dosesTotal:
              type: integer
            dosesDeclined:
              type: integer
            dosesUnknown:
              type: integer
        sleepMetrics:
          type: object
          properties:
            sleepAvg:
              type: number
            sleepObservationsCount:
              type: integer
            sleepDeficitNights:
              type: integer
        hydrationMetrics:
          type: object
          properties:
            hydrationAvgMl:
              type: number
            hydrationDaysTracked:
              type: integer
            belowTargetDays:
              type: integer
        weightMetrics:
          type: object
          properties:
            weightChange:
              type: number
            currentWeight:
              type: number
            weightUnit:
              type: string
            rapidGainDetected:
              type: boolean

    ReportAttestation:
      type: object
      properties:
        clinicianUserId:
          type: string
        clinicianName:
          type: string
        attestationStatement:
          type: string
        statementVersion:
          type: string
        confirmedContentHash:
          type: string
        attestedAt:
          type: string
          format: date-time
        ipAddress:
          type: string
        userAgent:
          type: string

    EvidenceReference:
      type: object
      properties:
        targetSection:
          type: string
        claimSummary:
          type: string
        evidenceType:
          type: string
          enum: [OBSERVATION, FLAG, METRIC, CHECKIN]
        sourceId:
          type: string
        sourceSnippet:
          type: string
        confidence:
          type: number

    ClinicalReportResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            _id:
              type: string
            patientId:
              type: string
            organizationId:
              type: string
            reportType:
              type: string
            status:
              type: string
              enum: [GENERATED, VALIDATING, DRAFT, PENDING_REVIEW, APPROVED, PUBLISHED, REJECTED, SUPERSEDED, AMENDED, STALE]
            version:
              type: integer
            rootReportId:
              type: string
            supersedesReportId:
              type: string
            contentHash:
              type: string
            narrationEngine:
              type: string
              enum: [GEMINI, TEMPLATE_FALLBACK]
            deterministicMetrics:
              $ref: '#/components/schemas/DeterministicMetrics'
            sections:
              type: object
            attestation:
              $ref: '#/components/schemas/ReportAttestation'
            evidenceReferences:
              type: array
              items:
                $ref: '#/components/schemas/EvidenceReference'
            dataCompleteness:
              type: object
              properties:
                overallStatus:
                  type: string
                limitations:
                  type: array
                  items:
                    type: string
        meta:
          type: object
          properties:
            requestId:
              type: string
            timestamp:
              type: string

